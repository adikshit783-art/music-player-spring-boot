<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet"
          href="/style.css">
</head>

<body>

<div class="music-player">

    <h1>🎵 Music Player</h1>

    <!-- Search -->
    <div class="search-box">

        <input
                type="text"
                id="searchInput"
                placeholder="Search songs or artists">

        <button onclick="searchSongs()">
            Search
        </button>

    </div>

    <!-- Current Song -->
    <div class="current-song">

        <img
                id="coverImage"
                src="/images/default.jpg"
                alt="Album Cover">

        <h2 id="songTitle">
            Select a song
        </h2>

        <p id="songArtist">
            Artist
        </p>

    </div>

    <!-- Audio -->
    <audio id="audioPlayer"></audio>

    <!-- Controls -->
    <div class="controls">

        <button onclick="previousSong()">
            ⏮
        </button>

        <button onclick="togglePlay()" id="playButton">
            ▶
        </button>

        <button onclick="nextSong()">
            ⏭
        </button>

    </div>

    <!-- Volume -->
    <div class="volume-control">

        <label for="volume">
            Volume
        </label>

        <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1">

    </div>

    <!-- Song List -->
    <div class="song-list">

        <h2>All Songs</h2>

        <div id="songsContainer">
            Loading songs...
        </div>

    </div>

</div>

<script src="/app.js"></script>

</body>

</html>
